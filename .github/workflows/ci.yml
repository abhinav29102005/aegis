name: AEGIS Platform CI

on:
  push:
    branches: [main, integration/nexus, "feature/*"]
  pull_request:
    branches: [main, integration/nexus]

permissions:
  contents: read
  security-events: write

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis_test_password
          POSTGRES_DB: aegis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aegis -d aegis_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - name: Install Python workspace dependencies
        run: uv sync --frozen --python 3.12
      - name: Lint Python workspace with Ruff
        run: uv run ruff check packages modules services
      - name: Audit Python dependencies with pip-audit
        run: |
          uv export --frozen --no-emit-workspace --no-hashes -o /tmp/aegis-reqs.txt
          uv run pip-audit -r /tmp/aegis-reqs.txt --desc
      - name: Verify Alembic migrations against PostgreSQL 16
        env:
          DATABASE_URL: postgresql+psycopg://aegis:aegis_test_password@localhost:5432/aegis_test
        run: cd packages/database && uv run alembic upgrade head && uv run alembic downgrade base && uv run alembic upgrade head
      - name: Run full Python & PostgreSQL test suite with coverage
        env:
          AEGIS_TEST_POSTGRES_URL: postgresql+psycopg://aegis:aegis_test_password@localhost:5432/aegis_test
          REDIS_URL: redis://localhost:6379/0
        run: uv run pytest -v --cov=packages --cov=modules --cov=services --cov-report=term-missing

  typescript-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
      - name: Audit, typecheck & test @aegis-platform/sdk
        working-directory: packages/sdk-typescript
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          npm run typecheck
          npm test

  web-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
      - name: Audit, typecheck, lint, test & build apps/web
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_APP_NAME: AEGIS
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=critical
          npm run typecheck
          npm run lint
          npm test
          npm run build

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Check for accidental committed secrets or .env files
        run: |
          if git ls-files | grep -E '^\.env(\.|$)' | grep -v '\.env\.example$'; then
            echo "ERROR: .env file committed to git!"
            exit 1
          fi
      - name: Scan git history for leaked secrets with Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build API, Worker, and Web container images for vulnerability scanning
        run: |
          docker build -t aegis-api:ci -f services/api/Dockerfile .
          docker build -t aegis-worker:ci -f services/worker/Dockerfile .
          docker build -t aegis-web:ci -f apps/web/Dockerfile .
      - name: Scan API image with Trivy
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # v0.30.0
        with:
          image-ref: aegis-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Scan Worker image with Trivy
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # v0.30.0
        with:
          image-ref: aegis-worker:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Scan Web image with Trivy
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # v0.30.0
        with:
          image-ref: aegis-web:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  compose-smoke:
    needs: [backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Boot Postgres, Redis, migrate, API, Worker, and Web via Docker Compose
        run: docker compose up -d --build postgres redis migrate api worker web
      - name: Verify API readiness endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/ready; then
              echo ""
              exit 0
            fi
            sleep 2
          done
          docker compose logs api migrate postgres
          exit 1
      - name: Verify Worker healthcheck and recent heartbeat
        run: |
          docker compose exec -T worker python -m aegis_worker.main --healthcheck
          docker compose ps
      - name: Verify Web /login and unauthenticated /api/auth/me
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3005/login >/dev/null; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              docker compose logs web api migrate postgres
              exit 1
            fi
            sleep 2
          done
          AUTH_CODE=$(curl -s -o /tmp/aegis-auth-me.json -w "%{http_code}" http://127.0.0.1:3005/api/auth/me)
          if [ "$AUTH_CODE" != "401" ] || ! grep -q "UNAUTHENTICATED" /tmp/aegis-auth-me.json; then
            echo "Unexpected /api/auth/me response: HTTP $AUTH_CODE $(cat /tmp/aegis-auth-me.json)"
            docker compose logs web api
            exit 1
          fi
      - name: Tear down Compose smoke stack
        if: always()
        run: docker compose down -v --remove-orphans
