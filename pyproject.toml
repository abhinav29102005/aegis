[project]
name = "agentpay-nexus"
version = "0.1.0"
description = "AEGIS — Agentic Enforcement, Governance and Investigation System"
requires-python = ">=3.12,<3.14"
dependencies = [
    "nexus-contracts",
    "nexus-security",
    "nexus-database",
    "nexus-paypal",
    "disputeos",
    "agentpay-guardian",
    "agentpay-ghostpay",
    "aegis-api",
    "aegis-worker",
    "aegis-sdk",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "langgraph>=0.2.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<10.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "ruff>=0.6.0,<1.0.0",
]

[tool.uv.workspace]
members = [
    "packages/contracts",
    "packages/security",
    "packages/database",
    "packages/paypal",
    "packages/sdk-python",
    "modules/disputeos",
    "modules/agentpay-guardian",
    "modules/ghostpay",
    "services/api",
    "services/worker",
]

[tool.uv.sources]
nexus-contracts = { workspace = true }
nexus-security = { workspace = true }
nexus-database = { workspace = true }
nexus-paypal = { workspace = true }
aegis-sdk = { workspace = true }
disputeos = { workspace = true }
agentpay-guardian = { workspace = true }
agentpay-ghostpay = { workspace = true }
aegis-api = { workspace = true }
aegis-worker = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]
testpaths = [
    "packages/contracts/tests",
    "packages/security/tests",
    "packages/database/tests",
    "packages/paypal/tests",
    "packages/sdk-python/tests",
    "modules/disputeos/tests",
    "modules/agentpay-guardian/tests",
    "modules/ghostpay/tests",
    "services/api/tests",
    "services/worker/tests",
]
