[project]
name = "agentpay-guardian"
version = "0.1.0"
description = "AgentPay Guardian — Preventive Authorization and Financial Controls"
requires-python = ">=3.12,<3.14"
dependencies = [
    "nexus-contracts",
    "nexus-security",
    "nexus-database",
    "nexus-paypal",
    "fastapi>=0.115.0,<1.0.0",
]

[tool.uv.sources]
nexus-contracts = { workspace = true }
nexus-security = { workspace = true }
nexus-database = { workspace = true }
nexus-paypal = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guardian"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

