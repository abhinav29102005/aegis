[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentpay-ghostpay"
version = "0.1.0"
description = "GhostPay — Policy Time Machine, Agent DNA, and Financial Forensics for AgentPay Nexus"
requires-python = ">=3.12,<3.14"
dependencies = [
    "nexus-contracts",
    "nexus-security",
    "fastapi>=0.115.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
]

[tool.uv.sources]
nexus-contracts = { workspace = true }
nexus-security = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["ghostpay"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
