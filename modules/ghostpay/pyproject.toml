[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostpay"
version = "0.1.0"
description = "GhostPay — Deterministic replay, counterfactual policy simulation, anomaly detection, and evidence provenance timelines"
requires-python = ">=3.12"
dependencies = [
    "nexus-contracts",
    "nexus-security",
    "fastapi>=0.115.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ghostpay*"]

