[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-sdk"
version = "0.1.0"
description = "Official Python SDK and AI agent authorization middleware for AEGIS"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aegis_sdk*"]
