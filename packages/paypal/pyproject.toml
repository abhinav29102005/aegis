[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-paypal"
version = "0.1.0"
description = "Isolated PayPal Sandbox Orders v2, Webhook Verification, and feature-flagged Disputes v1 executor"
requires-python = ">=3.12"
dependencies = [
    "nexus-contracts",
    "nexus-security",
    "httpx>=0.27.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["paypal*"]
